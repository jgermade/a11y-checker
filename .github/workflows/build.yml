name: Build

# Checks, tests and builds the whole monorepo.
# - Runs on every push (any branch), so work branches are checked before a PR exists.
# - release.yml calls it (workflow_call) to test and build the release commit before
#   publishing; the built packages are uploaded as the `packages-dist` artifact.

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build (defaults to the triggering ref).
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from release.yml, so a release
  # build never cancels (or is cancelled by) a push build.
  group: ${{ github.workflow }}-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the Cypress binary for its e2e test
        run: pnpm --filter @a11y-checker/cypress exec cypress install

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          # The build step above already produced the artifacts the e2e tests load.
          A11Y_CHECKER_PREBUILT: '1'
          # Fail instead of skipping the Cypress test if its binary is missing.
          A11Y_CHECKER_REQUIRE_CYPRESS: '1'

      - name: Package the browser extension
        run: pnpm --filter @a11y-checker/extension zip

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: packages/extension/.output/*.zip
          if-no-files-found: error
          # WXT writes to .output/, which upload-artifact skips by default.
          include-hidden-files: true

      # The built npm packages, published as is by release.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: packages/*/dist/
          if-no-files-found: error
          retention-days: 7
