name: Release

# On every push to main, Changesets either opens/updates a "Version packages" PR
# (when there are pending changesets) or, once that PR is merged, publishes the new
# versions to npm.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# Every public @a11y-checker package must have a trusted publisher on npmjs.com with
# repository jgermade/a11y-checker, workflow `release.yml` and environment `production`.
# Provenance attestations are generated automatically.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-24.04
    # Must match the environment configured in the npm trusted publishers.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      # pnpm hands the actual publish over to the npm CLI.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the Cypress binary for its e2e test
        run: pnpm --filter @a11y-checker/cypress exec cypress install

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          A11Y_CHECKER_PREBUILT: '1'
          A11Y_CHECKER_REQUIRE_CYPRESS: '1'

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
